      POSTGRES_USER: postgres
      POSTGRES_DB: ledger_test
      POSTGRES_PASSWORD: "bV4XiZMQ4l1jn18YB7QhsCvaXhokx7PG"
    volumes:
      - ledger_test_data:/var/lib/postgresql/data


volumes:
  ledger_data:
